name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ---- Windows amd64 ----
      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/dm-mcp-windows-amd64/dm-mcp.exe .

      - name: Package Windows amd64
        run: |
          cp -r dmfldr-bin dist/dm-mcp-windows-amd64/
          cp README.md TOOLS.md dist/dm-mcp-windows-amd64/
          cd dist && zip -r dm-mcp-windows-amd64.zip dm-mcp-windows-amd64

      - name: Copy Windows bare binary (for npm)
        run: cp dist/dm-mcp-windows-amd64/dm-mcp.exe dist/dm-mcp.exe

      # ---- Linux amd64 ----
      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/dm-mcp-linux-amd64/dm-mcp .

      - name: Package Linux amd64
        run: |
          cp README.md TOOLS.md dist/dm-mcp-linux-amd64/
          cd dist && tar -czf dm-mcp-linux-amd64.tar.gz dm-mcp-linux-amd64

      - name: Copy Linux bare binary (for npm)
        run: cp dist/dm-mcp-linux-amd64/dm-mcp dist/dm-mcp

      # ---- Publish GitHub Release ----
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/dm-mcp.exe
            dist/dm-mcp
          generate_release_notes: true

  # ---- Publish npm (@dm-mcp/server) ----
  # 依赖 GitHub Release 完成（npm 包的 download.js 从 Release 资产拉取二进制）。
  npm:
    name: Publish npm
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Align version with tag
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('npm/package.json'));p.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');fs.writeFileSync('npm/package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Publish to npm
        # scoped 包必须显式 --access public，否则默认发布为私有（免费组织无法发布私有包）
        run: npm publish npm/ --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
