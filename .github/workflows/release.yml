name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ''
          - os: linux
            arch: arm64
            ext: ''
          - os: windows
            arch: amd64
            ext: .exe
          - os: darwin
            arch: amd64
            ext: ''
          - os: darwin
            arch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build dm-mcp2 (${{ matrix.os }}/${{ matrix.arch }})
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o "dist/dm-mcp2-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dm-mcp2-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/dm-mcp2-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  npm:
    name: Publish npm package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Stage binaries into npm package
        run: |
          mkdir -p npm/bin
          cp dist/dm-mcp2-linux-amd64 npm/bin/dm-mcp2-linux-x64
          cp dist/dm-mcp2-linux-arm64 npm/bin/dm-mcp2-linux-arm64
          cp dist/dm-mcp2-darwin-amd64 npm/bin/dm-mcp2-darwin-x64
          cp dist/dm-mcp2-darwin-arm64 npm/bin/dm-mcp2-darwin-arm64
          cp dist/dm-mcp2-windows-amd64.exe npm/bin/dm-mcp2-win32-x64.exe
          chmod +x npm/bin/*

      - name: Sync version from tag
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
